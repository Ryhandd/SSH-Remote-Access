name: release

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dropbear_version:
        description: "Versi dropbear (tanpa prefix)"
        required: false
        default: "2026.94"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DROPBEAR_VERSION: ${{ inputs.dropbear_version || '2026.94' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Version
        id: v
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then TAG="$GITHUB_REF_NAME"; else TAG="v0.0.0-dev"; fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "code=$(git rev-list --count HEAD)" >> "$GITHUB_OUTPUT"

      - name: Lint
        run: |
          for f in module/*.sh scripts/*.sh; do bash -n "$f"; done
          sed -n '/<script>/,/<\/script>/p' module/webroot/index.html | sed '1d;$d' > /tmp/ui.js
          node --check /tmp/ui.js

      - name: Test status logic
        run: bash scripts/test-status.sh

      - name: Build dropbear (arm64)
        run: |
          set +e
          bash scripts/build-dropbear.sh > /tmp/build.log 2>&1
          rc=$?
          if [ "$rc" -ne 0 ]; then
            echo "build gagal (rc=$rc), 20 baris terakhir:"
            tail -n 20 /tmp/build.log
            tail -n 12 /tmp/build.log | sed 's/^/::error::/'
            exit "$rc"
          fi
          grep -E '^(==|ERROR)' /tmp/build.log || true
          file module/dropbear module/dropbearkey module/scp

      - name: Package
        run: bash scripts/package.sh "${{ steps.v.outputs.tag }}" "${{ steps.v.outputs.code }}" "$GITHUB_REPOSITORY"

      - name: Verify zip berisi binary
        run: |
          ZIP=$(ls dist/*.zip)
          echo "== isi $ZIP =="
          unzip -Z1 "$ZIP"
          for b in dropbear dropbearkey scp module.prop; do
            unzip -Z1 "$ZIP" | grep -qx "$b" || { echo "GAGAL: $b tidak ada di zip"; exit 1; }
          done
          unzip -p "$ZIP" dropbear | head -c 4 | xxd | grep -q '7f45 4c46' || { echo "GAGAL: dropbear bukan ELF"; exit 1; }
          echo "OK: zip lengkap"

      - uses: actions/upload-artifact@v4
        if: github.ref_type != 'tag'
        with:
          name: SSH-Remote-Access-${{ steps.v.outputs.tag }}
          path: dist/*.zip

      - name: Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          body_path: CHANGELOG.md
          draft: false
          prerelease: false
          make_latest: true
          fail_on_unmatched_files: true

      - name: Update update.json
        if: github.ref_type == 'tag'
        run: |
          TAG="${{ steps.v.outputs.tag }}"
          cat > /tmp/update.json <<EOF
          {
            "version": "$TAG",
            "versionCode": ${{ steps.v.outputs.code }},
            "zipUrl": "https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/SSH-Remote-Access-$TAG.zip",
            "changelog": "https://raw.githubusercontent.com/$GITHUB_REPOSITORY/main/CHANGELOG.md"
          }
          EOF
          sed -i 's/^          //' /tmp/update.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout -B main origin/main
          cp /tmp/update.json update.json
          git add update.json
          git diff --cached --quiet || { git commit -m "chore: update.json $TAG"; git push origin main; }
